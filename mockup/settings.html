<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Оформление Flowbar</title>
<style>
:root{color-scheme:dark;--base:#111114;--side:#17171c;--surface:#1c1c23;--line:#303038;--ink:#f6f4fa;--muted:#b4b0be;--quiet:#94909f;--ease:cubic-bezier(.22,1,.36,1);font:14px/1.43 "Segoe UI Variable", "Segoe UI", sans-serif}
*{box-sizing:border-box}body{margin:0;background:#09090c;color:var(--ink);min-width:300px}button,input{font:inherit}button{color:inherit}a{color:inherit}button:focus-visible,input:focus-visible,label:has(input:focus-visible){outline:2px solid #e3dfff;outline-offset:4px}button{cursor:pointer}
.shell{width:min(1280px,100%);margin:auto;display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh;background:var(--base)}
.sidebar{background:var(--side);border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:40px}.brand{display:flex;align-items:center;gap:12px;padding:0 8px;font-size:20px;font-weight:650;letter-spacing:-.035em}.mark{width:28px;height:28px;border-radius:8px;background:#e4dcfb;display:grid;place-items:center;color:#241d34;font-size:17px}.nav{display:grid;gap:4px}.nav button{border:1px solid transparent;background:none;text-align:left;border-radius:8px;padding:8px 12px;min-height:44px;color:var(--muted);display:flex;gap:12px;align-items:center}.nav button[aria-current=page]{border-color:#42394e;background:#2a2434;color:#f3e9ff}.nav button:hover{background:#26242d}.nav .glyph{font-size:18px;width:20px;text-align:center}.sidebar small{margin-top:auto;color:var(--quiet);padding:0 8px}
.content{min-width:0;padding:32px 40px 40px}header{margin-bottom:24px}h1,h2,p{margin:0}h1{font-size:36px;line-height:40px;font-weight:630;letter-spacing:-.045em;text-wrap:balance}h2,legend{font-size:16px;line-height:24px;font-weight:620}header p,.sub{color:var(--muted);margin-top:4px}.crumb{font-size:12px;line-height:16px;color:var(--quiet);margin-bottom:8px}.view[hidden]{display:none}
fieldset{min-width:0;border:0;padding:0;margin:0}legend{padding:0}.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}.theme{position:relative;display:flex;flex-direction:column;align-items:center;isolation:isolate;border:1px solid #292831;border-radius:16px;background:#151519;min-width:0;padding:16px 8px 12px;cursor:pointer;overflow:hidden;text-align:center}.theme:hover{border-color:#5b5466}.theme:has(input:checked){border-color:#6a6175;background:#1c1a22}.theme input,.swatch input{position:absolute;width:1px;height:1px;opacity:0}.theme .choice{position:absolute;top:8px;right:8px;font-size:12px;line-height:16px;opacity:0;color:#f1e8ff;z-index:4}.theme:has(input:checked) .choice{opacity:1}.art{height:152px;display:grid;place-items:center;width:100%;position:relative}.capsule{width:76px;height:128px;border-radius:999px;border:1px solid #ffffff2b;background:linear-gradient(165deg,#08080c 35%,color-mix(in srgb,var(--color),#08080c 78%));display:grid;place-items:center;position:relative;color:#efeef3;font-size:36px;line-height:1;z-index:2;transition:transform .5s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}.capsule::before{position:absolute;content:"";inset:0;border-radius:inherit;background:linear-gradient(135deg,color-mix(in srgb,var(--color),#fff 35%),#14111d 52%,color-mix(in srgb,var(--color),#000 25%));opacity:0;transition:opacity .3s var(--ease)}.capsule b{position:relative;font-weight:400;text-shadow:0 0 16px #fff7}.rays{position:absolute;inset:-30px -32px;pointer-events:none;opacity:0;transition:opacity .3s var(--ease),transform .5s var(--ease);transform:scale(.84);background:repeating-conic-gradient(from 8deg,var(--color) 0deg,transparent 2.5deg 10deg, color-mix(in srgb,var(--color),transparent 45%) 11deg,transparent 12.5deg 18deg);mask-image:radial-gradient(ellipse at center,#000 0%,#0009 24%,#0003 41%,transparent 66%);filter:blur(1px)}.art::before{content:"";position:absolute;inset:-20px -30px;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--color),transparent 43%),transparent 66%);opacity:0;transition:opacity .3s var(--ease)}.theme:has(input:checked) .art::before{opacity:.4}.theme:has(input:checked) .capsule{border-color:var(--color);box-shadow:0 0 18px color-mix(in srgb,var(--color),transparent 38%),inset 0 0 12px color-mix(in srgb,var(--color),transparent 42%)}.theme:has(input:checked) .capsule::before{opacity:.55}.theme:hover .capsule,.theme:has(input:focus-visible) .capsule{transform:scale(1.04);border-color:#fff;box-shadow:0 0 5px #fff,0 0 14px var(--color),0 0 32px var(--color),inset 0 0 12px #fffa}.theme:hover .capsule::before,.theme:has(input:focus-visible) .capsule::before{opacity:.9}.theme:hover .rays,.theme:has(input:focus-visible) .rays{opacity:.75;transform:scale(1)}.theme:hover .art::before,.theme:has(input:focus-visible) .art::before{opacity:.8}.theme strong,.theme small{z-index:3;position:relative}.theme strong{font-size:14px;line-height:20px;font-weight:620}.theme small{color:#c6c0ce;font-size:12px;line-height:16px;margin-top:4px}
.options{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:16px 0}.options legend{float:left;margin-right:16px;line-height:36px}.swatches{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.swatch{display:grid;place-items:center;border:1px solid transparent;border-radius:999px;width:36px;height:36px;cursor:pointer;position:relative}.swatch span{display:grid;place-items:center;background:var(--swatch);height:22px;width:22px;border-radius:999px;color:#101017;font-size:12px;font-weight:700}.swatch:has(input:checked){border-color:#f1e8ff}.swatch:not(:has(input:checked)):hover{border-color:#797180}
.preview-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 8px}.preview-head span{font-size:12px;color:var(--muted)}.scene{position:relative;overflow:hidden;isolation:isolate;border:1px solid #ffffff25;border-radius:16px;min-height:144px;display:flex;justify-content:center;align-items:flex-end;padding:12px;background:#17162a}.scene::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 14% 85%,#5840a0,transparent 58%),radial-gradient(ellipse at 70% 18%,#24505b,transparent 62%),#15152a}.scene[data-side=top]{align-items:flex-start}.dock{--accent:#9fe1ff;--dock-bg:#151924d0;--dock-ink:#f6f4fa;--chip:#ffffff12;--dock-height:48px;--offset:0px;--glass:12px;display:flex;align-items:center;gap:8px;max-width:100%;min-height:var(--dock-height);margin-block:var(--offset);padding:4px 8px;border-radius:16px;border:1px solid #ffffff45;box-shadow:0 8px 20px #0005;background:var(--dock-bg);color:var(--dock-ink);backdrop-filter:blur(var(--glass));font-variant-numeric:tabular-nums}.dock>span{display:flex;align-items:center;gap:4px;min-height:30px;border-radius:8px;padding:4px 8px;white-space:nowrap}.dock [hidden]{display:none}.dock .tile{background:var(--chip)}.dock .dock-start{color:var(--accent);font-size:20px}.dock .meter{width:28px;height:4px;border-radius:999px;background:var(--accent);display:inline-block}.dock .clock{font-weight:650}.dock .preview-icon{color:var(--accent)}
.rows{display:grid;gap:8px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:64px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}.row .sub{font-size:12px;line-height:16px}.row input[type=checkbox]{width:20px;height:20px;accent-color:#d6c3f2}.segments{display:flex;gap:4px}.segments button{background:#25242b;border:1px solid #3a3843;border-radius:8px;padding:8px 12px;min-height:40px}.segments button[aria-pressed=true]{background:#e4d9f8;color:#211a2c;border-color:transparent}.range{display:flex;gap:8px;align-items:center;white-space:nowrap}.range input{width:116px;accent-color:#d6c3f2}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}
@media(max-width:900px){.shell{grid-template-columns:168px minmax(0,1fr)}.content{padding:24px}.swatches{gap:4px}}
@media(max-width:650px){.shell{display:block}.sidebar{padding:12px;gap:12px;border-right:0;border-bottom:1px solid var(--line)}.sidebar small{display:none}.nav{grid-template-columns:repeat(3,1fr);gap:4px}.nav button{padding:8px;gap:4px;justify-content:center;font-size:12px}.nav .glyph{display:none}.content{padding:16px}.themes{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:132px}.capsule{width:64px;height:112px}.row{flex-wrap:wrap}.scene{padding:8px}.dock{gap:4px}.dock>span{padding:4px}.meter{display:none!important}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.theme:hover .capsule,.theme:has(input:focus-visible) .capsule,.theme:hover .rays,.theme:has(input:focus-visible) .rays{transform:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><span class="mark" aria-hidden="true">▦</span>Flowbar</div>
    <nav class="nav" aria-label="Разделы настроек">
      <button type="button" data-section="look" aria-current="page"><span class="glyph" aria-hidden="true">◈</span>Оформление</button>
      <button type="button" data-section="bar"><span class="glyph" aria-hidden="true">▱</span>Панель</button>
      <button type="button" data-section="widgets"><span class="glyph" aria-hidden="true">⊞</span>Виджеты</button>
    </nav>
    <small>Демонстрация настроек</small>
  </aside>
  <main class="content">
    <header><div class="crumb">Настройки</div><h1 id="heading">Оформление</h1><p id="description">Выберите материал и цвет акцента.</p></header>
    <section class="view" id="look" aria-label="Оформление">
      <fieldset>
        <legend>Тема</legend>
        <div class="themes" id="themes"></div>
      </fieldset>
      <div class="options">
        <fieldset><legend>Акцент</legend><div class="swatches" id="swatches"></div></fieldset>
      </div>
    </section>
    <section class="view rows" id="bar" aria-label="Панель" hidden>
      <div class="row"><div><h2>Высота</h2><p class="sub">Размер панели и элементов внутри неё</p></div><div class="segments" id="sizes" role="group" aria-label="Высота панели"><button type="button" data-size="S">S</button><button type="button" data-size="M">M</button><button type="button" data-size="L">L</button><button type="button" data-size="XL">XL</button></div></div>
      <div class="row"><h2>Положение</h2><div class="segments" id="position" role="group" aria-label="Положение панели"><button type="button" data-side="top">Сверху</button><button type="button" data-side="bottom">Снизу</button></div></div>
      <label class="row" for="gap"><span>Отступ от края</span><span class="range"><input id="gap" type="range" min="0" max="24" step="2"><output id="gapValue" for="gap"></output></span></label>
      <label class="row" for="opacity"><span>Плотность заливки</span><span class="range"><input id="opacity" type="range" min="30" max="100" step="5"><output id="opacityValue" for="opacity"></output></span></label>
    </section>
    <section class="view rows" id="widgets" aria-label="Виджеты" hidden>
      <label class="row"><span>Музыка</span><input type="checkbox" data-widget="music"></label>
      <label class="row"><span>Погода</span><input type="checkbox" data-widget="weather"></label>
      <label class="row"><span>Часы</span><input type="checkbox" data-widget="clock"></label>
    </section>
    <section aria-labelledby="preview-title">
      <div class="preview-head"><h2 id="preview-title">Предпросмотр панели</h2><span id="preview-label"></span></div>
      <div class="scene" id="scene">
        <div class="dock" id="dock" aria-label="Пример панели Flowbar">
          <span class="dock-start" aria-hidden="true">▦</span><span aria-hidden="true">⌕</span>
          <span class="tile" data-preview="music"><b class="preview-icon" aria-hidden="true">♪</b> Музыка <i class="meter" aria-hidden="true"></i></span>
          <span class="tile" data-preview="weather"><b class="preview-icon" aria-hidden="true">☀</b> 13°</span>
          <span class="tile clock" data-preview="clock">11:46</span>
        </div>
      </div>
    </section>
    <p class="sr" id="status" role="status"></p>
  </main>
</div>
<script id="presets" type="application/json">
[
  {"id":"Black","name":"Уголь","material":"Тёмная","glyph":"♨","glow":"#ff7049","accent":"#4CC2FF","bg":"#121212","alpha":0.93,"fg":"#ffffff","blur":0},
  {"id":"iOS Glass","name":"Солнце","material":"Светлое стекло","glyph":"☼","glow":"#ffcf60","accent":"#0A63D6","bg":"#f4f4f7","alpha":0.82,"fg":"#111111","blur":18},
  {"id":"Liquid Glass","name":"Ветер","material":"Прозрачное стекло","glyph":"≋","glow":"#6af4d0","accent":"#9FE1FF","bg":"#000000","alpha":0.24,"fg":"#ffffff","blur":12},
  {"id":"Midnight","name":"Сумерки","material":"Синяя ночь","glyph":"☾","glow":"#b39bff","accent":"#7AA2FF","bg":"#0d1426","alpha":0.93,"fg":"#e6ecff","blur":0}
]
</script>
<script>
'use strict';
const presets = JSON.parse(document.querySelector('#presets').textContent);
const accents = [
  ['', 'Как в теме'], ['#4CC2FF','Голубой'], ['#7AA2FF','Синий'], ['#A78BFA','Лиловый'],
  ['#F472B6','Розовый'], ['#F87171','Коралловый'], ['#FB923C','Оранжевый'],
  ['#FACC15','Золотой'], ['#4ADE80','Зелёный'], ['#2DD4BF','Бирюзовый']
];
const sizes = {S:48, M:60, L:72, XL:88};
const sectionCopy = {
  look:['Оформление','Выберите материал и цвет акцента.'],
  bar:['Панель','Настройте размер и расположение панели на экране.'],
  widgets:['Виджеты','Выберите, что будет видно на панели.']
};
const storageKey = 'flowbar-settings-prototype-v1';
function readSaved() {
  try { return JSON.parse(localStorage.getItem(storageKey)) || {}; } catch { return {}; }
}
const saved = readSaved();
const state = {
  style: presets.some(item => item.id === saved.style) ? saved.style : 'Liquid Glass',
  accent: accents.some(([hex]) => hex === saved.accent) ? saved.accent : '',
  size: Object.hasOwn(sizes, saved.size) ? saved.size : 'M',
  side: saved.side === 'top' ? 'top' : 'bottom',
  gap: Number.isFinite(saved.gap) ? Math.min(24, Math.max(0, saved.gap)) : 8,
  opacity: Number.isFinite(saved.opacity) ? Math.min(100, Math.max(30, saved.opacity)) : 100,
  widgets: Object.fromEntries(['music','weather','clock'].map(id => [id,saved.widgets?.[id] !== false]))
};
let hovered = null;
const $ = selector => document.querySelector(selector);
function save() { try { localStorage.setItem(storageKey, JSON.stringify(state)); } catch {} }
function update() {
  const current = presets.find(item => item.id === (hovered || state.style));
  const color = state.accent || current.accent;
  const dock = $('#dock');
  dock.style.setProperty('--accent', color);
  dock.style.setProperty('--dock-ink', current.fg);
  dock.style.setProperty('--chip', current.id === 'iOS Glass' ? '#00000012' : '#ffffff15');
  dock.style.setProperty('--dock-bg', current.bg + Math.round(current.alpha * state.opacity * 2.55).toString(16).padStart(2, '0'));
  dock.style.setProperty('--glass', current.blur + 'px');
  dock.style.setProperty('--dock-height', sizes[state.size] + 'px');
  dock.style.setProperty('--offset', state.gap + 'px');
  $('#scene').dataset.side = state.side;
  $('#preview-label').textContent = (hovered && hovered !== state.style ? 'Примерка · ' : '') + current.name;
  $('#swatches').style.setProperty('--theme-accent', current.accent);
  for (const button of document.querySelectorAll('[data-size]')) button.setAttribute('aria-pressed', String(button.dataset.size === state.size));
  for (const button of document.querySelectorAll('#position [data-side]')) button.setAttribute('aria-pressed', String(button.dataset.side === state.side));
  for (const [id, visible] of Object.entries(state.widgets)) {
    document.querySelector('[data-preview="' + id + '"]').hidden = !visible;
  }
  $('#gapValue').textContent = state.gap + ' px';
  $('#opacityValue').textContent = state.opacity + '%';
}
function commit(message) { hovered = null; save(); update(); $('#status').textContent = message; }
for (const item of presets) {
  const card = document.createElement('label');
  card.className = 'theme';
  card.style.setProperty('--color', item.glow);
  card.innerHTML = '<input type="radio" name="style"><span class="choice" aria-hidden="true">✓</span><span class="art" aria-hidden="true"><span class="rays"></span><span class="capsule"><b></b></span></span><strong></strong><small></small>';
  const input = card.querySelector('input');
  input.value = item.id;
  input.checked = state.style === item.id;
  card.querySelector('b').textContent = item.glyph;
  card.querySelector('strong').textContent = item.name;
  card.querySelector('small').textContent = item.material;
  card.addEventListener('pointerenter', event => { if (event.pointerType === 'mouse' && state.style !== item.id) { hovered = item.id; update(); } });
  card.addEventListener('pointerleave', () => { hovered = null; update(); });
  input.addEventListener('change', () => { if (input.checked) { state.style = item.id; commit('Выбрана тема «' + item.name + '»'); } });
  $('#themes').append(card);
}
for (const [hex, name] of accents) {
  const label = document.createElement('label');
  label.className = 'swatch';
  label.title = name;
  label.style.setProperty('--swatch', hex || 'var(--theme-accent)');
  label.innerHTML = '<input type="radio" name="accent"><span aria-hidden="true"></span>';
  const input = label.querySelector('input');
  input.value = hex;
  input.checked = state.accent === hex;
  input.setAttribute('aria-label', name);
  if (!hex) label.querySelector('span').textContent = 'А';
  input.addEventListener('change', () => { if (input.checked) { state.accent = hex; commit('Акцент · ' + name); } });
  $('#swatches').append(label);
}
for (const button of document.querySelectorAll('[data-section]')) {
  button.addEventListener('click', () => {
    const section = button.dataset.section;
    for (const view of document.querySelectorAll('.view')) view.hidden = view.id !== section;
    for (const tab of document.querySelectorAll('[data-section]')) {
      if (tab === button) tab.setAttribute('aria-current','page'); else tab.removeAttribute('aria-current');
    }
    [$('#heading').textContent, $('#description').textContent] = sectionCopy[section];
    hovered = null;
    update();
  });
}
for (const button of document.querySelectorAll('#sizes button')) button.addEventListener('click', () => { state.size = button.dataset.size; commit('Размер ' + state.size); });
for (const button of document.querySelectorAll('#position button')) button.addEventListener('click', () => { state.side = button.dataset.side; commit('Положение · ' + button.textContent); });
for (const field of ['gap','opacity']) {
  const input = $('#' + field);
  input.value = state[field];
  input.addEventListener('input', () => { state[field] = input.valueAsNumber; save(); update(); });
}
for (const input of document.querySelectorAll('[data-widget]')) {
  input.checked = state.widgets[input.dataset.widget];
  input.addEventListener('change', () => { state.widgets[input.dataset.widget] = input.checked; save(); update(); });
}
update();
</script>
</body>
</html>
